name: floor

# atelier's own CI — it dogfoods the floor every review asserts by hand: the
# tool test suite, the scanner --selftests, and the scans re-run over the whole
# tree (the leak/secret/licence publish triad, plus linkscan's internal-link
# integrity check). Now possible because the repo is public (ADR 0005): the tools
# are zero-dep stdlib Python, so a runner needs nothing but Python to run them.
# The instruments/ layer (ADR 0006) adds a zero-dep Node surface — its tests use
# node:test/node:assert, so a runner needs only Node, nothing from npm.
#
# HONEST SCOPE. This gate proves what it can prove in CI, not everything the
# local hooks prove:
#   - secretscan / licenscan run at FULL cover here — no machine-local state.
#   - leakscan runs STRUCTURAL-ONLY. Its literal person/estate term list is
#     machine-local by design (~/.claude, never in any repo), so CI cannot have
#     it and MUST NOT (that list is itself the thing we keep out of repos). We
#     deliberately do NOT pass --require-terms: a degraded structural pass is the
#     correct, honest CI cover, and the pre-commit hook on a real machine — where
#     the term list exists — is where full leakscan cover lives. See tools/README.
#
# This same file is the reference a child repo copies to fetch atelier's public
# tools/ in its own CI (ROADMAP: wire the public scanners into child CI) — there
# the "run in-repo tools" steps become a checkout of mike548141/atelier instead.

# Every push, not just main (2026-07-11 child-CI-floor review, N4 follow-up).
# atelier is public (ADR 0005), so a push to ANY branch is already publication —
# the commit is on the remote whether or not it is ever PR'd or merged, and a
# feature branch that never sees a PR was previously scanned by nothing. This job
# IS the floor (its whole purpose is dogfooding the publish-safety scans), so it
# gates publication, not just the merge — the same call floor.yml made for
# children. A same-repo PR branch runs twice (push + PR event); that costs
# seconds (zero-dep stdlib) and is the right side of the trade for a safety floor.
# workflow_dispatch allows a manual re-run without an empty push.
#
# COST NOTE — this every-push economics is atelier's *because it is public*:
# public Actions runs are free, and every push here IS publication, so the gate
# and the zero cost align. A PRIVATE repo copying this pattern runs on METERED
# Actions minutes (billed per job, rounded up to the minute), where a push is not
# yet publication and every-push is a backstop over the pre-commit hook. Whether
# that trade is worth its minutes is an estate-specific call, not a fixed one —
# see docs/method/MODEL-ECONOMICS.md, "The compute pool — CI minutes".
on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: the floor only reads the tree (contents:read also lets the
# signature step's gh-api plane read commit verification state).
permissions:
  contents: read

# Adoption boundary for commit-signature verification (SIGNING.md, ADR 0007):
# the last UNSIGNED commit before atelier's boundary 958b1ea. Everything after
# it must verify. Set here (not empty) because atelier has real pre-signing
# history that must not be flagged.
env:
  SIGN_BOUNDARY: "450b10d"

# Cost hygiene — a newer push to the same ref cancels the superseded run.
concurrency:
  group: floor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # signature verification needs full history (rev-list)

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: scanner selftests
        run: |
          python3 tools/leakscan.py --selftest
          python3 tools/secretscan.py --selftest
          python3 tools/licenscan.py --selftest
          python3 tools/linkscan.py --selftest
          python3 tools/signscan.py --selftest
          python3 tools/sizescan.py --selftest

      - name: tool test suite
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      # Shell glob, not hand-enumerated files: it expands at run time, so a
      # future instruments/*.test.js can't silently skip CI. (A directory arg is
      # rejected by Node 22+; a quoted glob needs Node 21+ — the shell glob
      # works on every Node this job might pin.)
      - name: instrument test suite
        run: node --test instruments/*.test.js

      - name: secretscan (full tree)
        run: python3 tools/secretscan.py --root . .

      - name: leakscan (structural-only — see header)
        run: python3 tools/leakscan.py --root . .

      - name: licenscan (assert Apache-2.0)
        run: python3 tools/licenscan.py --expect Apache-2.0 .

      - name: linkscan (internal-link integrity, full tree)
        run: python3 tools/linkscan.py --root . .

      # Current-truth files (ROADMAP, SESSIONS index, README…) must stay lean so
      # a session resumes cheaply. --check makes it a gate (advisory otherwise);
      # atelier keeps its own files harvested, and the hatches exist for a
      # legitimately long file (RECORD.md's current-truth/history split).
      - name: sizescan (current-truth budgets)
        run: python3 tools/sizescan.py --check --root . .

      # --- commit-signature verification (SIGNING.md, ADR 0007) --------------
      # atelier is the trust root, so it verifies against its OWN allowed_signers
      # at the tested commit (no pin resolution — children resolve at their pin,
      # atelier is the pin). WARN-FIRST while the fleet settles; to block, drop
      # `--warn` and turn the gh-plane warning into an error + exit 1.
      - name: Verify commit signatures — machine-key plane (warn-first)
        run: |
          python3 tools/signscan.py \
            --allowed-signers allowed_signers --boundary "$SIGN_BOUNDARY" --warn

      - name: Verify commit signatures — GitHub-server plane (warn-first)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Merge/squash commits GitHub minted (two already on main: a0ef731,
          # 4b2cf6f) carry no machine key — assert GitHub's own verification.
          DEFERRED=$(python3 tools/signscan.py \
            --allowed-signers allowed_signers --boundary "$SIGN_BOUNDARY" --json \
            | python3 -c 'import json,sys; [print(r["sha"]) for r in json.load(sys.stdin)["results"] if r["plane"]=="github"]')
          for SHA in $DEFERRED; do
            V=$(gh api "repos/${{ github.repository }}/commits/$SHA" --jq '.commit.verification.verified' 2>/dev/null || echo error)
            [ "$V" = "true" ] || echo "::warning::server commit $SHA not GitHub-verified (got: $V)"
          done
