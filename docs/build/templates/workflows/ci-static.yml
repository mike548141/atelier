# CI for a static site. The site ships build-less, so this is a
# correctness gate, not a build: it proves every local asset reference
# (/inc/..., /img/...) still resolves before anything reaches `main`. It
# cannot judge whether the page *looks* right — that stays a
# human-in-a-browser check (see CONTRIBUTING). stdlib-only Python;
# nothing to install.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  links:
    name: local asset references resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check local links
        run: python3 tools/check_links.py
